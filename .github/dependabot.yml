version: 2
updates:
  - package-ecosystem: maven
    directory: /Aceguessr
    schedule:
      interval: monthly
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # The plugin targets the Paper 1.21 runtime used by the server.
      - dependency-name: io.papermc.paper:paper-api
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
